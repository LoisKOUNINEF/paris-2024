name: Run Tests

on:
  pull_request:
    branches:
      - staging

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      env:
        CYPRESS_INSTALL_BINARY: 0

    - name: Run Nx affected lint
      run: npx nx affected -t lint --parallel=3 --base=origin/main --head=HEAD

    - name: Run Nx affected build
      run: npx nx affected -t build --parallel=3 --base=origin/main --head=HEAD

    - name: Run Nx tests
      run: npx nx run-many --target=test --parallel=3 --passWithNoTests