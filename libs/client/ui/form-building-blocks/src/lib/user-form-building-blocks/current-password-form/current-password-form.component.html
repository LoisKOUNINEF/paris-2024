<div [formGroup]="currentPasswordForm">
	<mat-form-field 
		[hintLabel]="hint"
		class="form-class"
	>
		<label for="currentPassword" class="label">
			Mot de passe actuel
		</label>
		<input 
			matInput
			name="currentPassword"
			type="{{ showPassword | revealPassword }}" 
			id="currentPassword" 
			placeholder="Mot de passe actuel" 
			class="form-input" 
			formControlName="currentPassword"
			autocomplete="current-password"
			[required]="required"
		>
		@if(
			currentPasswordForm.controls['currentPassword'].touched 
			&& currentPasswordForm.controls['currentPassword'].hasError('required')
		) {
			<mat-error>
				Mot de passe actuel requis.
			</mat-error>
		}
	</mat-form-field>
  <div class="reveal-password">
		<input 
			name="reveal-current-password"
			type="checkbox" 
			(click)=revealPassword()
		>
		{{ showPassword | pwdCheckboxText }}
	</div>
</div>
