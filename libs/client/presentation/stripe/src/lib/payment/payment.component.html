<main class="payment-form" autocomplete="off">
  <div id="card-element" class="card-element"></div>
  <button
    (click)="confirmPayment()"
    [disabled]="!clientSecret || isProcessing"
    class=""
  >
    @if(amount !== null) {
      Payer {{ amount | formatPrice | currency:'symbol':'€':'1.2-2' }}
    } @else {
      Payer
    }
  </button>
  @if(error) {
 	  <div class="error">{{ error }}</div>
	}
</main>
